name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Release Pull Request
        id: changesets
        uses: changesets/action@v1
        with:
          commit: 'chore(release): version package'
          title: 'chore(release): version package'
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # When there are no changesets, it means a version PR was just merged.
      # Build and publish the new version to npm using OIDC trusted publishing.
      - name: Build
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: pnpm run build

      - name: Publish to npm (trusted publishing)
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          # Remove the .npmrc created by setup-node so npm uses OIDC instead of NODE_AUTH_TOKEN
          rm -f "$NPM_CONFIG_USERCONFIG"
          npm publish --provenance --access public
